<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYM — Independent Apps</title>
<meta name="description" content="RYM is a small store for apps made by one independent maker.">
<meta property="og:title" content="RYM — Independent Apps">
<meta property="og:description" content="Little apps, made with intention.">
<meta name="theme-color" content="#D9E3BD">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23D9E3BD'/%3E%3Ctext x='32' y='44' font-size='40' font-style='italic' font-family='Georgia,serif' text-anchor='middle' fill='%234A2E22'%3Er.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
:root{--sage:#D9E3BD;--ivory:#FDFBEF;--esp:#4A2E22;--red:#A32A33;--lilac:#D9C9E2;--blush:#F5DFDD;--rose:#DDB8D6;--olive:#4C4A23;--peach:#FAEDE0;--sky:#CBD9E8;
--serif:"Instrument Serif",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--hand:"Reenie Beanie","Segoe Script",cursive}
*{box-sizing:border-box;margin:0}
body{background:var(--ivory);color:var(--esp);font:13px/1.8 var(--mono);text-transform:uppercase;letter-spacing:.06em;-webkit-font-smoothing:antialiased}
a{color:inherit}
.bar{background:var(--esp);color:var(--ivory);text-align:center;font-size:11px;padding:8px 14px}
header{background:var(--sage);display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1.5px solid var(--esp)}
.logo{font:400 44px/1 var(--hand);text-decoration:none;text-transform:none;letter-spacing:0}
header nav{display:flex;gap:26px;font-size:12px}header nav a{text-decoration:none}header nav a:hover,header nav a.on{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:6px}
.c{max-width:1180px;margin:auto;padding:0 5vw}
.hero{background:var(--sage);text-align:center;padding:64px 5vw 72px;border-bottom:1.5px solid var(--esp)}
.hero small{font-size:12px}
h1,h2{font-family:var(--serif);font-weight:400;text-transform:none;letter-spacing:-.015em;line-height:.98}
h1{font-size:clamp(50px,9vw,120px);margin:22px auto 26px;max-width:12ch}
em{font-style:italic;background:var(--blush);padding:0 .1em}
em.l{background:var(--lilac)}
.pill{display:inline-block;border:1.5px solid var(--esp);border-radius:50%/50%;padding:10px 26px;font-size:10px;line-height:1.5;margin-top:6px}
.def{padding:72px 0 56px}
.def h2{font-size:clamp(70px,12vw,150px);text-align:center;margin-bottom:26px}
.def ol{max-width:620px;margin:auto;padding-left:20px}.def li{margin:6px 0}
.ring{border:1.5px solid var(--red);border-radius:50%;padding:2px 10px}
.u{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:4px}
.hl{background:var(--lilac);padding:1px 8px}
.sec{padding:36px 0 80px}
.sec .k{text-align:center}.sec h2{font-size:clamp(56px,9vw,110px);text-align:center;margin:10px 0 4px}
.hand{font:400 40px/1 var(--hand);color:var(--red);text-transform:none;letter-spacing:0;text-align:center;margin-bottom:34px;transform:rotate(-2deg)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:38px}
.chip{background:none;border:1.5px solid var(--esp);color:var(--esp);font:inherit;font-size:11px;padding:6px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}
.chip.on,.chip:hover{background:var(--esp);color:var(--ivory)}
input[type=search]{border:0;border-bottom:1.5px solid var(--esp);background:transparent;font:inherit;font-size:12px;padding:6px 2px;color:var(--esp);min-width:220px;text-transform:uppercase}
input:focus{outline:2px solid var(--red);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:40px 30px}
.p{text-decoration:none;text-align:center;display:block}
.art{aspect-ratio:1;display:grid;place-items:center;padding:20px}
.art img{width:52%;height:auto}.shots img{width:100%;border:1.5px solid var(--esp)}
.art b{font:400 clamp(30px,3.4vw,50px)/.95 var(--serif);overflow-wrap:anywhere;max-width:100%;text-transform:none;letter-spacing:-.01em;text-align:center}
.p:hover .art b{font-style:italic}
.cap{margin-top:14px;font-size:11px;line-height:1.6}.cap i{display:block;font-style:italic}
.band{background:var(--esp);color:var(--ivory);padding:56px 0}
.band h2{font-size:clamp(44px,7vw,84px);text-align:center;margin-bottom:22px}
.band a{display:flex;justify-content:space-between;text-decoration:none;font-size:12px;padding:16px 0;border-top:1px solid var(--ivory);max-width:640px;margin:auto}
.band a:last-child{border-bottom:1px solid var(--ivory)}.band a:hover{color:var(--sage)}
.crumb{font-size:11px;padding:26px 0 8px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:5vw;padding:10px 0 80px;align-items:start}
.pd h1{max-width:none;margin:14px 0 20px;font-size:clamp(50px,7vw,96px)}
.pd .art{aspect-ratio:1}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1.5px solid var(--esp);font-size:12px}.row:last-of-type{border-bottom:1.5px solid var(--esp)}
.row span:last-child{text-align:right}
h3{font:400 34px/1 var(--serif);text-transform:none;letter-spacing:0;margin:34px 0 10px}
.btn{display:inline-block;background:var(--esp);color:var(--ivory);border:1.5px solid var(--esp);padding:11px 22px;text-decoration:none;font-size:12px;margin:0 8px 8px 0}
.btn:hover{background:var(--red);border-color:var(--red)}
.btn[aria-disabled=true]{background:transparent;color:var(--esp);border-style:dashed;opacity:.6;pointer-events:none}
.ph{color:var(--red);font-style:italic}
ul.f{padding-left:18px}ul.f li{margin:4px 0}
.cl{border-left:2px solid var(--red);padding-left:14px;margin:8px 0}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:14px}.shots div{aspect-ratio:3/4;border:1.5px dashed var(--esp);background:var(--peach);display:grid;place-items:center;font-size:10px;text-align:center;padding:12px}
.empty{grid-column:1/-1;text-align:center;padding:40px 0}
.nf{text-align:center;padding:90px 5vw}.nf h1{margin:0 auto 10px}
footer{background:var(--sage);border-top:1.5px solid var(--esp);text-align:center;padding:44px 5vw 30px;font-size:11px}
footer .logo{display:block;font-size:64px;margin-bottom:6px}
@media(max-width:820px){.pd{grid-template-columns:1fr}input[type=search]{width:100%}}
</style>
</head>
<body>
<div class="bar">New apps are added slowly · made by one person</div>
<header><a class="logo" href="#/">rym.</a><nav><a href="#/" data-r="home">Home</a><a href="#/apps" data-r="apps">Apps</a></nav></header>
<main id="app"></main>
<footer><span class="logo">rym.</span>Independent apps · © <span id="yr"></span> RYM</footer>
<script>
/* ===== Add an app = add one object to PRODUCTS. null/empty fields show a marked placeholder. ===== */
let PRODUCTS=[];const TBD=`<span class="ph">To be added</span>`;
const $=(s,r=document)=>r.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ph=t=>`<span class="ph">${t} — to be added</span>`;
const tile=p=>`<div class="art" style="background:${esc(p.bg||"#D9E3BD")};color:${esc(p.fg||"#4A2E22")}">${p.icon?`<img src="${esc(p.icon)}" alt="${esc(p.name)} icon">`:`<b>${esc(p.name)}</b>`}</div>`;
const card=p=>`<a class="p" href="#/p/${p.slug}">${tile(p)}<div class="cap">${esc(p.name)}<i>${esc(p.platforms.join(", "))}${p.status?" · "+esc(p.status):""}</i></div></a>`;
const meta=(t,d)=>{document.title=t;$('meta[name=description]').content=d};
function home(){
 meta("RYM — Independent Apps","RYM is a small store for apps made by one independent maker.");
 return `<section class="hero"><small>Welcome to the world of…</small>
 <h1>little <em>apps</em> – made with <em class="l">intention</em></h1><span class="pill">Independent · One maker<br>Download below</span></section>
 <section class="def c"><h2>“RYM”</h2><ol><li>A STORE FOR <span class="ring">APPS</span>, ALL MADE BY ONE PERSON.</li><li>A PLACE TO <span class="u">DOWNLOAD</span> THEM.</li><li><span class="hl">NOTHING ELSE.</span></li></ol></section>
 <section class="sec c"><div class="k">A few of our apps…</div><h2>The apps</h2><div class="hand">pick one &amp; take it home</div><div class="grid">${PRODUCTS.map(card).join("")}</div></section>
`;
}
let F={cat:"all",q:""};
function apps(cat){
 
 meta("Apps — RYM","Browse every app by RYM.");
 return `<section class="sec c"><div class="k">All of them…</div><h2>The apps</h2><div class="hand">search &amp; pick one</div>
 <div class="tools"><input type="search" id="q" placeholder="Search" aria-label="Search apps" value="${esc(F.q)}"></div>
 <div class="grid" id="grid" aria-live="polite"></div></section>`;
}
function paint(){
 const q=F.q.trim().toLowerCase();
 const l=PRODUCTS.filter(p=>(!q||[p.name,p.description,...p.platforms,...(p.tech||[])].join(" ").toLowerCase().includes(q)));
 $("#grid").innerHTML=l.length?l.map(card).join(""):`<div class="empty">Nothing here yet${q?` for “${esc(F.q)}”`:""}.</div>`;
 
}
function product(slug){
 const p=PRODUCTS.find(x=>x.slug===slug);if(!p)return nf();
 meta(p.name+" — RYM",p.description||p.name);
 const V=p.versions||[],L=V[0],pl=p.platforms||[];
 const T=v=>v?esc(v):TBD,row=(a,b)=>`<div class="row"><span>${a}</span><span>${b}</span></div>`;
 const sz=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
 const btns=[...(L?L.assets.map(a=>`<a class="btn" href="${esc(a.url)}" rel="noopener">${esc(a.platform||"Download")} · ${esc(a.name)} (${sz(a.size)})</a>`):[]),...(p.links||[]).map(l=>`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`)].join("")||`<a class="btn" aria-disabled="true" role="link" tabindex="-1">Download link to be added</a>`;
 const sh=p.screenshots||[];
 return `<div class="c"><div class="crumb"><a href="#/apps">← All apps</a></div><div class="pd"><div>${tile(p)}
 <h3>Screenshots</h3><div class="shots">${sh.length?sh.map(x=>`<img src="${esc(x)}" alt="${esc(p.name)} screenshot" loading="lazy">`).join(""):`<div>Screenshot placeholder</div><div>Screenshot placeholder</div>`}</div></div>
 <div><span class="hl">App</span><h1>${esc(p.name)}</h1><p>${p.description?esc(p.description):ph("Description")}</p>
 <h3>Details</h3>${row("Version",L?"v"+esc(L.version):TBD)}${row("Status",T(p.status))}${row("Release date",L?esc(L.date):TBD)}${row("Platforms",pl.length?pl.map(esc).join(", "):TBD)}${row("Technology",(p.tech||[]).length?p.tech.map(esc).join(", "):TBD)}
 <h3>Download</h3>${btns}
 <h3>Features</h3>${(p.features||[]).length?`<ul class="f">${p.features.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:`<p>${ph("Feature list")}</p>`}
 <h3>Changelog</h3>${V.length?V.map((v,i)=>`<div class="cl"><b>v${esc(v.version)}</b> · ${esc(v.date)}${v.notes?`<p style="white-space:pre-wrap;text-transform:none;letter-spacing:0">${esc(v.notes)}</p>`:""}${i&&v.assets.length?`<p>${v.assets.map(a=>`<a href="${esc(a.url)}" rel="noopener">${esc(a.name)}</a>`).join(" · ")}</p>`:""}</div>`).join(""):`<p>${ph("Changelog")}</p>`}</div></div></div>`;
}
function nf(){meta("Page not found — RYM","This page does not exist.");return `<div class="nf"><h1>404</h1><p style="margin-bottom:22px">This page wandered off.</p><a class="btn" href="#/">Back home</a></div>`}
function route(){
 const x=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);let h,k="";
 if(!x.length){h=home();k="home"}else if(x[0]==="apps"&&x.length<=2){h=apps(x[1]);k="apps"}else if(x[0]==="p"&&x[1]){h=product(x[1]);k="apps"}else h=nf();
 app.innerHTML=h;scrollTo(0,0);
 document.querySelectorAll("header nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===k));
 if(x[0]==="apps"){paint();$("#q").oninput=e=>{F.q=e.target.value;paint()}}
}
$("#yr").textContent=new Date().getFullYear();addEventListener("hashchange",route);
fetch("data/products.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{PRODUCTS=(d.products||[]).filter(p=>p.published)},()=>{app.innerHTML='<div class="nf"><p>The catalogue could not be loaded.</p></div>';return 1}).then(f=>{if(!app.innerHTML)route()});
</script>
</body>
</html>
