<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>RYM — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sage:#D9E3BD;--ivory:#FDFBEF;--esp:#4A2E22;--red:#A32A33;--lilac:#D9C9E2;--peach:#FAEDE0;--serif:"Instrument Serif",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}body{background:var(--ivory);color:var(--esp);font:13px/1.6 var(--mono)}
header{background:var(--sage);border-bottom:1.5px solid var(--esp);padding:12px 4vw;display:flex;justify-content:space-between;align-items:center}
header b{font:italic 32px var(--serif);font-weight:400}
h2{font:400 40px/1 var(--serif);margin:0 0 14px}h3{font:400 28px/1 var(--serif);margin:28px 0 10px}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:3vw;padding:24px 4vw 80px}
.side button.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--esp);padding:10px 4px;font:inherit;color:inherit;cursor:pointer}
.side button.item.on,.side button.item:hover{background:var(--sage)}.tag{font-size:10px;border:1px solid var(--esp);padding:0 5px;margin-left:6px}
label{display:block;margin:12px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
input[type=text],input[type=password],textarea,select{width:100%;border:1.5px solid var(--esp);background:#fff9;padding:8px;font:inherit;color:var(--esp);border-radius:0}
input[type=color]{width:60px;height:34px;border:1.5px solid var(--esp);padding:0;background:none}
textarea{min-height:80px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--red)}
.btn{background:var(--esp);color:var(--ivory);border:1.5px solid var(--esp);padding:8px 16px;font:inherit;cursor:pointer;margin:8px 8px 0 0}
.btn:hover{background:var(--red);border-color:var(--red)}.btn.g{background:none;color:var(--esp)}.btn.g:hover{background:var(--esp);color:var(--ivory)}.btn.d{background:none;color:var(--red);border-color:var(--red)}.btn:disabled{opacity:.5;cursor:wait}
.box{border:1.5px solid var(--esp);padding:14px;margin:12px 0;background:var(--peach)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}.thumbs figure{width:120px}.thumbs img{width:100%;border:1.5px solid var(--esp);display:block}
.icon{width:96px;height:96px;object-fit:contain;border:1.5px solid var(--esp)}
progress{width:160px}.ass{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--esp);padding:6px 0}
.upl-st{font-size:11px;color:var(--esp);margin-top:6px;font-style:italic}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--esp);color:var(--ivory);padding:10px 18px;display:none;max-width:90vw;z-index:9}
#toast.err{background:var(--red)}.login{max-width:360px;margin:12vh auto;padding:0 20px}.hide{display:none}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style></head><body>
<header><b>rym. admin</b><span><a href="/" style="color:inherit">View store ↗</a> <button class="btn g" id="out" style="display:none">Log out</button></span></header>
<main id="root"></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db={products:[]},cur=null,tt;
const toast=(m,e)=>{const t=$("#toast");t.textContent=m;t.className=e?"err":"";t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",e?7000:3500)};
async function api(method,path,body){
  const r=await fetch("/api/"+path,{method,credentials:"same-origin",headers:{"X-RYM-Admin":"1",...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(r.status===401&&path!=="login"){showLogin();throw new Error("Please log in")}
  if(!r.ok)throw new Error(j.error||r.statusText);return j}
function upload(path,file,onp){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("POST","/api/"+path);x.setRequestHeader("X-RYM-Admin","1");
  x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total,e.loaded,e.total);x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}x.status<300?res(j):rej(new Error(j.error||"Upload failed ("+x.status+")"))};
  x.onerror=()=>rej(new Error("Network error"));x.send(file)})}
function uploadDirect(helperUrl,slug,version,platform,file,onp){return new Promise((res,rej)=>{const x=new XMLHttpRequest();
  x.open("POST",`${helperUrl}/upload?slug=${encodeURIComponent(slug)}&version=${encodeURIComponent(version)}&platform=${encodeURIComponent(platform)}&name=${encodeURIComponent(file.name)}`);
  x.setRequestHeader("X-RYM-Admin","1");
  x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total,e.loaded,e.total);
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}x.status<300?res(j):rej(new Error(j.error||"Upload helper failed ("+x.status+")"))};
  x.onerror=()=>rej(new Error("Could not connect to RYM Upload Helper at "+helperUrl));
  x.send(file)})}
const run=async(btn,fn)=>{if(btn)btn.disabled=true;try{await fn()}catch(e){toast(e.message,1)}finally{if(btn)btn.disabled=false}};
const slugify=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
const sz=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.round(n/1024)+" KB";

function showLogin(){$("#out").style.display="none";$("#root").innerHTML=`<div class="login"><h2>Log in</h2><label for="pw">Admin password</label><input type="password" id="pw" autocomplete="current-password"><button class="btn" id="go">Log in</button></div>`;
  const go=()=>run($("#go"),async()=>{await api("POST","login",{password:$("#pw").value});await boot()});$("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};$("#pw").focus()}
async function boot(){const me=await fetch("/api/me",{credentials:"same-origin"}).then(r=>r.json()).catch(()=>({}));
  if(!me.authenticated)return showLogin();$("#out").style.display="";await load();draw()}
async function load(){db=await api("GET","products")}
$("#out").onclick=async()=>{await api("POST","logout").catch(()=>{});showLogin()};
const P=()=>db.products.find(p=>p.slug===cur);

function draw(){
  $("#root").innerHTML=`<div class="wrap"><div class="side"><button class="btn" id="new" style="margin:0 0 12px">+ New product</button>
   ${db.products.map(p=>`<button class="item ${p.slug===cur?"on":""}" data-s="${esc(p.slug)}">${esc(p.name)}${p.published?"":'<span class="tag">draft</span>'}</button>`).join("")||"<p>No products yet.</p>"}
   <p style="margin-top:18px;font-size:11px">Changes are committed to GitHub; the public store redeploys automatically (about a minute).</p></div><div id="ed"></div></div>`;
  $("#new").onclick=()=>{cur="";draw()};document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{cur=b.dataset.s;draw()});editor()}
function editor(){
  const ed=$("#ed");if(cur===null){ed.innerHTML="<h2>Select or create a product</h2>";return}
  const p=P()||{name:"",slug:"",description:"",status:"",platforms:[],tech:[],features:[],links:[],bg:"#D9E3BD",fg:"#4A2E22",published:false,icon:null,screenshots:[],versions:[]},isNew=!P();
  ed.innerHTML=`<h2>${isNew?"New product":esc(p.name)}</h2><form id="f">
   <div class="two"><div><label>Name</label><input type="text" name="name" value="${esc(p.name)}" required maxlength="60"></div>
   <div><label>ID (used in the URL)</label><input type="text" name="slug" value="${esc(p.slug)}" ${isNew?"":"readonly"} pattern="[a-z0-9][a-z0-9-]*"></div></div>
   <label>Description</label><textarea name="description" maxlength="600">${esc(p.description)}</textarea>
   <div class="two"><div><label>Release status (e.g. Beta)</label><input type="text" name="status" value="${esc(p.status)}"></div><div><label>Platforms (comma separated)</label><input type="text" name="platforms" value="${esc(p.platforms.join(", "))}"></div></div>
   <div class="two"><div><label>Technology (comma separated)</label><input type="text" name="tech" value="${esc(p.tech.join(", "))}"></div><div><label>Tile colours</label><div class="row"><input type="color" name="bg" value="${p.bg}"> background <input type="color" name="fg" value="${p.fg}"> text</div></div></div>
   <label>Features (one per line)</label><textarea name="features">${esc(p.features.join("\n"))}</textarea>
   <label>External links (one per line: Label | https://…)</label><textarea name="links">${esc(p.links.map(l=>l.label+" | "+l.url).join("\n"))}</textarea>
   <label><input type="checkbox" name="published" ${p.published?"checked":""}> Published (visible on the public store)</label>
   <button class="btn" type="submit">${isNew?"Create product":"Save changes"}</button>${isNew?"":'<button class="btn d" type="button" id="del">Delete product</button>'}</form>
   ${isNew?"<p style='margin-top:20px'>Save the product first to add images and releases.</p>":media(p)+versions(p)}`;
  const f=$("#f");if(isNew)f.name.oninput=()=>f.slug.value=slugify(f.name.value);
  f.onsubmit=e=>{e.preventDefault();run(f.querySelector("[type=submit]"),async()=>{
    const v=n=>f[n].value,csv=n=>v(n).split(",").map(x=>x.trim()).filter(Boolean);
    const body={name:v("name"),description:v("description"),status:v("status"),platforms:csv("platforms"),tech:csv("tech"),features:v("features").split("\n").map(x=>x.trim()).filter(Boolean),
      links:v("links").split("\n").map(l=>{const[a,...b]=l.split("|");return{label:(a||"").trim(),url:b.join("|").trim()}}).filter(l=>l.label&&l.url),bg:v("bg"),fg:v("fg"),published:f.published.checked};
    const sl=v("slug");const out=await api("PUT","products/"+encodeURIComponent(sl),body);await load();cur=out.slug;draw();toast("Saved. The store updates after the next deploy.")})};
  const d=$("#del");if(d)d.onclick=()=>{if(!confirm("Delete “"+p.name+"”? This removes its images.")||false)return;const purge=confirm("Also delete its GitHub releases and uploaded files?\nOK = delete releases too, Cancel = keep releases on GitHub.");
    run(d,async()=>{await api("DELETE","products/"+p.slug+(purge?"?purge=1":""));cur=null;await load();draw();toast("Product deleted")})};
  if(!isNew)wire(p)}
function media(p){return `<h3>Images</h3><div class="box"><label>Icon (PNG, JPEG or WebP, max 3 MB)</label><div class="row">${p.icon?`<img class="icon" src="${esc(p.icon)}" alt="">`:"<span>No icon</span>"}
  <input type="file" id="icf" accept="image/png,image/jpeg,image/webp"><button class="btn" id="icb">Upload icon</button>${p.icon?`<button class="btn d" data-rm="${esc(p.icon)}">Remove</button>`:""}</div>
  <label>Screenshots (max 8)</label><div class="thumbs">${p.screenshots.map(s=>`<figure><img src="${esc(s)}" alt=""><button class="btn d" data-rm="${esc(s)}" style="margin-top:4px">Remove</button></figure>`).join("")}</div>
  <div class="row" style="margin-top:8px"><input type="file" id="shf" accept="image/png,image/jpeg,image/webp" multiple><button class="btn" id="shb">Upload screenshots</button></div></div>`}
function versions(p){return `<h3>Versions &amp; downloads</h3><div class="box"><label>New release</label><div class="two"><input type="text" id="nv" placeholder="1.0.0"><span></span></div>
  <label>Release notes</label><textarea id="nn"></textarea><button class="btn" id="nb">Create release on GitHub</button></div>
  ${p.versions.map(v=>`<div class="box" data-v="${esc(v.version)}"><b style="font-size:16px">v${esc(v.version)}</b> · ${esc(v.date)} ${v===p.versions[0]?'<span class="tag">latest</span>':""}
   <label>Release notes</label><textarea data-n>${esc(v.notes)}</textarea><button class="btn g" data-act="notes">Save notes</button><button class="btn d" data-act="delver">Delete version</button>
   <label>Files</label>${v.assets.map(a=>`<div class="ass"><span><a href="${esc(a.url)}">${esc(a.name)}</a> · ${esc(a.platform)} · ${sz(a.size)}</span><button class="btn d" data-act="delass" data-id="${a.id}" style="margin:0">Delete</button></div>`).join("")||"<p>No files yet.</p>"}
   <div class="row" style="margin-top:8px"><select data-pl style="width:130px">${["Android","Windows","macOS","Linux","iOS","Other"].map(x=>`<option>${x}</option>`).join("")}</select><input type="file" data-file accept=".apk,.aab,.exe,.msi,.zip,.dmg,.deb,.AppImage,.gz,.pkg">
   <button class="btn" data-act="upl" style="margin:0">Upload file</button><progress value="0" max="1" class="hide"></progress></div>
   <div class="upl-st hide" data-st></div></div>`).join("")}`}
function wire(p){
  const slug=p.slug,after=async m=>{await load();draw();m&&toast(m)};
  const up=async(file,kind)=>{if(!file)throw new Error("Choose a file first");await upload(`products/${slug}/media?kind=${kind}`,file,()=>{})};
  $("#icb").onclick=e=>run(e.target,async()=>{await up($("#icf").files[0],"icon");await after("Icon uploaded")});
  $("#shb").onclick=e=>run(e.target,async()=>{const fs=[...$("#shf").files];if(!fs.length)throw new Error("Choose images first");for(const f of fs)await up(f,"screenshot");await after("Screenshots uploaded")});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>confirm("Remove this image?")&&run(b,async()=>{await api("DELETE",`products/${slug}/media?path=${encodeURIComponent(b.dataset.rm.split("?")[0])}`);await after("Image removed")}));
  $("#nb").onclick=e=>run(e.target,async()=>{await api("POST",`products/${slug}/versions`,{version:$("#nv").value,notes:$("#nn").value});await after("Release created on GitHub")});
  document.querySelectorAll("[data-v]").forEach(box=>{const v=box.dataset.v;
    const fi=box.querySelector("[data-file]"),st=box.querySelector("[data-st]");
    if(fi)fi.onchange=()=>{const f=fi.files[0];if(st&&f){st.classList.remove("hide");st.textContent=`Selected: ${f.name} (${sz(f.size)})${f.size>90*1024*1024?" · Large binary (>90MB)":""}`}};
    box.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
      if(act==="notes")run(b,async()=>{await api("PATCH",`products/${slug}/versions/${v}`,{notes:box.querySelector("[data-n]").value});await after("Notes saved")});
      if(act==="delver"&&confirm("Delete version "+v+" and its GitHub release and files?"))run(b,async()=>{await api("DELETE",`products/${slug}/versions/${v}`);await after("Version deleted")});
      if(act==="delass"&&confirm("Delete this file?"))run(b,async()=>{await api("DELETE",`products/${slug}/versions/${v}/assets/${b.dataset.id}`);await after("File deleted")});
      if(act==="upl")run(b,async()=>{const f=box.querySelector("[data-file]").files[0];if(!f)throw new Error("Choose a file first");const pr=box.querySelector("progress"),st=box.querySelector("[data-st]");
        pr.classList.remove("hide");pr.value=0;if(st)st.classList.remove("hide");
        const pl=box.querySelector("[data-pl]").value;
        const isLarge=f.size>90*1024*1024;const helperUrl="http://127.0.0.1:8790";
        if(isLarge){
          const helperOk=await fetch(helperUrl+"/health").then(r=>r.ok).catch(()=>false);
          if(!helperOk)throw new Error(`File is ${sz(f.size)}. Cloudflare Workers limits uploads to 90 MB. For files up to 500 MB+, start the upload helper with: "node server/upload-helper.mjs" in your terminal, then click upload again.`);
          if(st)st.textContent=`Streaming ${sz(f.size)} to GitHub Releases via local helper...`;
          await uploadDirect(helperUrl,slug,v,pl,f,(pct,loaded,total)=>{pr.value=pct;if(st)st.textContent=`Uploading: ${Math.round(pct*100)}% (${sz(loaded)} / ${sz(total)})`});
          if(st)st.textContent="Upload complete! Updating catalog...";
        }else{
          if(st)st.textContent=`Uploading ${sz(f.size)}...`;
          await upload(`products/${slug}/versions/${v}/assets?name=${encodeURIComponent(f.name)}&platform=${encodeURIComponent(pl)}`,f,(pct,loaded,total)=>{pr.value=pct;if(st)st.textContent=`Uploading: ${Math.round(pct*100)}% (${sz(loaded||f.size*pct)} / ${sz(total||f.size)})`});
        }
        await after(`File uploaded to release v${v}`)})})})}
boot();
</script></body></html>
