backend:
  name: github
  repo: YOUR_GITHUB_USER/rym-store   # edit
  branch: main
  base_url: https://YOUR-OAUTH-PROXY.example.workers.dev   # GitHub OAuth proxy (see README)
media_folder: public/images/products
public_folder: /images/products
collections:
  - name: catalog
    label: Catalog
    files:
      - name: products
        label: Products
        file: src/data/products.json
        fields:
          - label: Products
            name: products
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {label: Slug, name: slug, widget: string}
              - {label: Name, name: name, widget: string}
              - {label: Tagline, name: tagline, widget: string}
              - {label: Description, name: description, widget: text}
              - {label: Category, name: category, widget: select, options: [app, game]}
              - {label: Type, name: type, widget: string}
              - {label: Featured, name: featured, widget: boolean, default: false}
              - {label: Status, name: status, widget: select, options: [released, coming-soon]}
              - {label: Version, name: version, widget: string, required: false}
              - {label: Release date, name: releaseDate, widget: string, required: false}
              - {label: File size, name: size, widget: string, required: false}
              - {label: Requirements, name: requirements, widget: list, default: []}
              - {label: Features, name: features, widget: list, default: []}
              - {label: Screenshots, name: screenshots, widget: list, field: {label: Image, name: img, widget: image}, default: []}
              - label: Changelog
                name: changelog
                widget: list
                default: []
                fields: [{label: Version, name: version, widget: string}, {label: Date, name: date, widget: string}, {label: Notes, name: notes, widget: list}]
              - label: Downloads
                name: downloads
                widget: list
                default: []
                fields:
                  - {label: Platform, name: platform, widget: select, options: [android, windows, linux, web, source]}
                  - {label: URL (GitHub Release asset), name: url, widget: string}
                  - {label: Version, name: version, widget: string}
                  - {label: Size, name: size, widget: string, required: false}
